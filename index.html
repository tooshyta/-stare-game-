<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⭐ مغامرة النجوم</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4facfe, #6a5acd);
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 15px;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 1000px;
    text-align: center;
}

h1 {
    margin: 5px 0 12px;
    font-size: 32px;
}

.top-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
}

.box {
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    padding: 8px 18px;
    min-width: 100px;
}

.label {
    display: block;
    font-size: 13px;
}

.value {
    font-size: 22px;
    font-weight: bold;
}

/* مساحة اللعبة */

#game {
    position: relative;
    width: 100%;
    height: 560px;
    overflow: hidden;

    border: 4px solid white;
    border-radius: 22px;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.9) 0 2px, transparent 3px),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,0.8) 0 2px, transparent 3px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,0.7) 0 2px, transparent 3px),
        linear-gradient(180deg, #101d4d, #182b6b);

    background-size: 120px 120px, 180px 180px, 200px 200px, 100% 100%;

    touch-action: none;
}

/* اللاعب */

#player {
    position: absolute;

    width: 60px;
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 45px;

    user-select: none;
    pointer-events: none;

    transition: transform 0.05s linear;
}

/* النجمة */

#star {
    position: absolute;

    width: 55px;
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 45px;

    user-select: none;
    pointer-events: none;
}

/* رسالة */

#message {
    margin-top: 8px;
    font-size: 18px;
    font-weight: bold;
}

/* شاشة النتيجة */

#result {
    position: absolute;

    inset: 0;

    background: rgba(0,0,0,0.75);

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    z-index: 20;

    padding: 20px;
}

#resultEmoji {
    font-size: 85px;
}

#resultTitle {
    font-size: 34px;
    margin: 10px 0;
}

#resultText {
    font-size: 20px;
    margin-bottom: 18px;
}

#restart {
    border: none;
    border-radius: 15px;

    padding: 13px 25px;

    font-size: 18px;
    font-weight: bold;

    background: #ffd43b;
    color: #222;

    cursor: pointer;
}

/* أزرار الهاتف */

.mobile-controls {
    display: none;
    justify-content: center;
    margin-top: 10px;
}

.controls-grid {
    display: grid;

    grid-template-columns: 65px 65px 65px;
    grid-template-rows: 65px 65px;

    gap: 6px;
}

.control-btn {
    width: 65px;
    height: 65px;

    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 16px;

    background: rgba(255,255,255,0.25);
    color: white;

    font-size: 30px;
    font-weight: bold;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;

    touch-action: manipulation;

    cursor: pointer;
}

.control-btn:active {
    background: rgba(255,255,255,0.5);
    transform: scale(0.92);
}

/* توزيع الأزرار */

.up {
    grid-column: 2;
    grid-row: 1;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

/* التعليمات */

.instructions {
    margin-top: 12px;

    background: rgba(255,255,255,0.15);

    border-radius: 12px;

    padding: 10px;

    font-size: 15px;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 700px) {

    body {
        padding: 5px;
        align-items: flex-start;
    }

    .container {
        width: 100%;
        max-width: none;
    }

    h1 {
        font-size: 25px;
        margin: 4px 0 8px;
    }

    .top-bar {
        gap: 5px;
        margin-bottom: 7px;
    }

    .box {
        min-width: 85px;
        padding: 6px 4px;
        border-radius: 10px;
    }

    .label {
        font-size: 11px;
    }

    .value {
        font-size: 18px;
    }

    /* تكبير اللعبة على الهاتف */

    #game {
        width: 100%;

        height: 68vh;

        min-height: 450px;
        max-height: 650px;

        border-width: 3px;
        border-radius: 18px;
    }

    #player {
        width: 58px;
        height: 58px;
        font-size: 43px;
    }

    #star {
        width: 55px;
        height: 55px;
        font-size: 44px;
    }

    /* إظهار أزرار اللمس */

    .mobile-controls {
        display: flex;
    }

    .controls-grid {
        grid-template-columns: 58px 58px 58px;
        grid-template-rows: 58px 58px;
        gap: 5px;
    }

    .control-btn {
        width: 58px;
        height: 58px;
        font-size: 27px;
        border-radius: 14px;
    }

    #message {
        font-size: 15px;
        margin-top: 6px;
    }

    /* إخفاء التعليمات حتى تبقى الشاشة واسعة */

    .instructions {
        display: none;
    }

    #resultEmoji {
        font-size: 65px;
    }

    #resultTitle {
        font-size: 28px;
    }

    #resultText {
        font-size: 17px;
    }

    #restart {
        font-size: 17px;
        padding: 12px 22px;
    }
}


/* الهواتف الصغيرة جدًا */

@media (max-width: 380px) {

    h1 {
        font-size: 22px;
    }

    .box {
        min-width: 78px;
    }

    .value {
        font-size: 16px;
    }

    #game {
        height: 62vh;
        min-height: 400px;
    }

    .controls-grid {
        grid-template-columns: 52px 52px 52px;
        grid-template-rows: 52px 52px;
    }

    .control-btn {
        width: 52px;
        height: 52px;
        font-size: 24px;
    }
}

</style>
</head>


<body>

<div class="container">

    <h1>⭐ مغامرة النجوم ⭐</h1>

    <div class="top-bar">

        <div class="box">
            <span class="label">النقاط</span>
            <span class="value" id="score">0</span>
        </div>

        <div class="box">
            <span class="label">المستوى</span>
            <span class="value" id="level">1</span>
        </div>

        <div class="box">
            <span class="label">الوقت</span>
            <span class="value" id="time">3</span>
        </div>

    </div>


    <div id="game">

        <div id="player">😋</div>

        <div id="star">⭐</div>


        <div id="result">

            <div id="resultEmoji">🎉</div>

            <div id="resultTitle">
                أحسنت!
            </div>

            <div id="resultText">
                حصلت على 10 نجوم!
            </div>

            <button id="restart">
                🔄 العب من جديد
            </button>

        </div>

    </div>


    <!-- أزرار الهاتف -->

    <div class="mobile-controls">

        <div class="controls-grid">

            <button class="control-btn up" data-key="ArrowUp">
                ⬆️
            </button>

            <button class="control-btn left" data-key="ArrowLeft">
                ⬅️
            </button>

            <button class="control-btn down" data-key="ArrowDown">
                ⬇️
            </button>

            <button class="control-btn right" data-key="ArrowRight">
                ➡️
            </button>

        </div>

    </div>


    <div id="message">
        اجمع النجمة قبل انتهاء الوقت! ⭐
    </div>


    <div class="instructions">
        💻 الكمبيوتر: استخدم أسهم لوحة المفاتيح
        <br>
        📱 الهاتف: استخدم أزرار الاتجاهات
    </div>

</div>


<script>

const game = document.getElementById("game");

const player = document.getElementById("player");

const star = document.getElementById("star");

const scoreElement = document.getElementById("score");

const levelElement = document.getElementById("level");

const timeElement = document.getElementById("time");

const message = document.getElementById("message");

const result = document.getElementById("result");

const resultTitle = document.getElementById("resultTitle");

const resultText = document.getElementById("resultText");

const resultEmoji = document.getElementById("resultEmoji");

const restartButton = document.getElementById("restart");


let playerX = 50;

let playerY = 50;

let score = 0;

let level = 1;

let timeLeft = 3;

let timer = null;

let gameRunning = true;

let keys = {};

let targetScore = 10;

let speed = 5;


/* وضع اللاعب */

function updatePlayer() {

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";

}


/* وضع النجمة */

function moveStar() {

    const maxX = game.clientWidth - 65;

    const maxY = game.clientHeight - 65;

    const x = Math.random() * maxX;

    const y = Math.random() * maxY;

    star.style.left = x + "px";
    star.style.top = y + "px";

}


/* إعادة الوقت */

function resetTimer() {

    timeLeft = 3;

    timeElement.textContent = timeLeft;

}


/* تشغيل المؤقت */

function startTimer() {

    clearInterval(timer);

    timer = setInterval(function() {

        if (!gameRunning) {
            return;
        }

        timeLeft--;

        timeElement.textContent = timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timer);

            loseGame();

        }

    }, 1000);

}


/* فحص الاصطدام */

function checkCollision() {

    const playerRect = player.getBoundingClientRect();

    const starRect = star.getBoundingClientRect();

    return !(
        playerRect.right < starRect.left ||
        playerRect.left > starRect.right ||
        playerRect.bottom < starRect.top ||
        playerRect.top > starRect.bottom
    );

}


/* جمع النجمة */

function collectStar() {

    score++;

    scoreElement.textContent = score;

    resetTimer();

    moveStar();

    if (score >= targetScore) {

        if (level < 3) {

            level++;

            levelElement.textContent = level;

            targetScore += 5;

            speed += 1;

            message.textContent =
                "🔥 مستوى جديد! استمر!";

        } else {

            winGame();

        }

    }

}


/* الفوز */

function winGame() {

    gameRunning = false;

    clearInterval(timer);

    resultEmoji.textContent = "🏆";

    resultTitle.textContent = "مبروك! 🎉";

    resultText.textContent =
        "لقد أنهيت جميع المستويات!";

    result.style.display = "flex";

}


/* الخسارة */

function loseGame() {

    gameRunning = false;

    clearInterval(timer);

    resultEmoji.textContent = "😢";

    resultTitle.textContent = "انتهى الوقت!";

    resultText.textContent =
        "جمعت " + score + " نجوم.";

    result.style.display = "flex";

}


/* إعادة اللعبة */

function restartGame() {

    score = 0;

    level = 1;

    targetScore = 10;

    speed = 5;

    playerX = 50;

    playerY = 50;

    gameRunning = true;

    scoreElement.textContent = score;

    levelElement.textContent = level;

    resetTimer();

    result.style.display = "none";

    message.textContent =
        "اجمع النجمة قبل انتهاء الوقت! ⭐";

    updatePlayer();

    moveStar();

    startTimer();

}


/* حركة اللاعب */

function movePlayer() {

    if (!gameRunning) {
        return;
    }


    const maxX = game.clientWidth - player.offsetWidth;

    const maxY = game.clientHeight - player.offsetHeight;


    if (keys["ArrowUp"]) {
        playerY -= speed;
    }

    if (keys["ArrowDown"]) {
        playerY += speed;
    }

    if (keys["ArrowLeft"]) {
        playerX -= speed;
    }

    if (keys["ArrowRight"]) {
        playerX += speed;
    }


    /* منع الخروج من اللعبة */

    playerX = Math.max(0, Math.min(playerX, maxX));

    playerY = Math.max(0, Math.min(playerY, maxY));


    updatePlayer();


    if (checkCollision()) {
        collectStar();
    }


    requestAnimationFrame(movePlayer);

}


/* لوحة المفاتيح */

document.addEventListener("keydown", function(event) {

    if (
        event.key === "ArrowUp" ||
        event.key === "ArrowDown" ||
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight"
    ) {

        event.preventDefault();

        keys[event.key] = true;

    }

});


document.addEventListener("keyup", function(event) {

    keys[event.key] = false;

});


/* أزرار الهاتف */

const controlButtons =
    document.querySelectorAll(".control-btn");


controlButtons.forEach(function(button) {

    const key = button.dataset.key;


    button.addEventListener("pointerdown", function(event) {

        event.preventDefault();

        keys[key] = true;

    });


    button.addEventListener("pointerup", function(event) {

        event.preventDefault();

        keys[key] = false;

    });


    button.addEventListener("pointercancel", function() {

        keys[key] = false;

    });


    button.addEventListener("pointerleave", function() {

        keys[key] = false;

    });

});


/* زر إعادة اللعب */

restartButton.addEventListener(
    "click",
    restartGame
);


/* منع قائمة الضغط المطول */

document.addEventListener(
    "contextmenu",
    function(event) {
        event.preventDefault();
    }
);


/* بداية اللعبة */

updatePlayer();

moveStar();

startTimer();

movePlayer();

</script>

</body>
</html>
